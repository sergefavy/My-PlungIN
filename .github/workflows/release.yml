name: Publier une version

# Pousser un tag « v0.2.0 » (même numéro que tauri.conf.json) publie la
# version sur GitHub ; les apps installées la proposent alors en mise à jour.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Tests du scanner
        run: cargo test -p plugin-core
        working-directory: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: My_PlugIN v__VERSION__
          releaseBody: Nouvelle version de My_PlugIN. L'app la propose toute seule via « Rechercher des mises à jour… ».
          releaseDraft: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin
